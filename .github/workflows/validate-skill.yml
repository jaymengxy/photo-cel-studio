name: Validate Photo Cel Studio

on:
  push:
    branches: [main, "design/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  skill-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify skill contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
